<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskHorizon // Premium To-Do</title>
    <link rel="stylesheet" href="todoapp.css">
    <!-- Optional: Google Fonts for premium typography -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>TaskHorizon</h1>
            <p>Collaborative Group Project</p>
        </header>

        <!-- MEMBER B FEATURE: TASK CREATION FORM -->
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" required>
            <button type="submit" id="add-btn">Add Task</button>
        </form>

        <!-- THE LIST CONTAINER WHERE DYNAMIC ITEMS WILL LIVE -->
        <ul id="todo-list">
            <!-- JavaScript will insert items here dynamically -->
        </ul>
    </div>

    <script src="todoapp.js"></script>
</body>
</html>
