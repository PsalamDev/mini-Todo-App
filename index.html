<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Horizon // Premium To-Do</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Student Task Horizon</h1>
            <p>A little space where you can plan and structure your tasks.</p>
        </header>

        
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" required>
            <button type="submit" id="add-btn">Add Task</button>
        </form>

        
        <ul id="todo-list">
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
